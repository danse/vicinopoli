# CI for vicinopoli.

name: vicinopoli CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://vicinopoli:vicinopoli@localhost:5432/vicinopoli_test
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: vicinopoli
          POSTGRES_PASSWORD: vicinopoli
          POSTGRES_DB: vicinopoli
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vicinopoli -d vicinopoli"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.0
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run mypy app
      - name: Create test database
        run: |
          uv run python - <<'EOF'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  host="localhost", port=5432, user="vicinopoli",
                  password="vicinopoli", database="postgres",
              )
              await conn.execute("CREATE DATABASE vicinopoli_test OWNER vicinopoli")
              await conn.close()

          asyncio.run(main())
          EOF
      - run: uv run pytest
      - name: OpenAPI schema is in sync with the committed snapshot
        run: |
          uv run python scripts/export_openapi.py > /tmp/openapi.new.json
          diff -u ../openapi/openapi.json /tmp/openapi.new.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:types
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright deps
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Pre-create backups dir (docker bind-mounts it as root otherwise)
        run: mkdir -p backups
      - name: Log in to Docker Hub (if credentials are configured)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and pull the e2e stack images (retry Docker Hub rate limits)
        run: |
          # GitHub-hosted runners share IPs and frequently hit Docker Hub's
          # anonymous pull limit ("pull access denied ... denied"). Retries
          # alone are not enough (the limit can outlast them), so the step
          # above authenticates when DOCKERHUB_USERNAME/TOKEN secrets exist;
          # this loop is the fallback for anonymous pulls. Pre-build and
          # pre-pull so Playwright's webServer never fetches from Docker Hub.
          for i in 1 2 3 4 5; do
            docker compose build && docker compose pull && exit 0
            echo "image fetch attempt $i failed; retrying in 15s"
            sleep 15
          done
          exit 1
      - name: Run e2e against the stack
        run: make test-e2e

  prod-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production images (fresh clone, prod compose)
        run: |
          # Same build the VPS runs (deploy/docker-compose.prod.yml). Fails
          # here, not at deploy time, if the build context or a COPY source
          # (e.g. openapi/openapi.json, frontend/nginx.conf) is missing.
          docker compose -f deploy/docker-compose.prod.yml build backend frontend
        env:
          # The prod compose requires real secrets (fail-fast on the VPS via
          # `${VAR:?...}`). This job only builds images and never runs any
          # service, so placeholders satisfy interpolation; `config` would
          # error otherwise.
          GRAFANA_ADMIN_PASSWORD: ci-build-placeholder
          ADMIN_TOKEN: ci-build-placeholder
          DOMAIN: vicinopoli.example
          POSTGRES_USER: vicinopoli
          POSTGRES_PASSWORD: vicinopoli
          POSTGRES_DB: vicinopoli
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
