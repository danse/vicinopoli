# CI for vicinopoli.

name: vicinopoli CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: vicinopoli
          POSTGRES_PASSWORD: vicinopoli
          POSTGRES_DB: vicinopoli
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vicinopoli -d vicinopoli"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: OpenAPI schema is in sync with the committed snapshot
        run: |
          uv run python scripts/export_openapi.py > /tmp/openapi.new.json
          diff -u ../openapi/openapi.json /tmp/openapi.new.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:types
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright deps
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e against the stack
        run: make test-e2e

  prod-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production images (fresh clone, prod compose)
        run: |
          # Same build the VPS runs (deploy/docker-compose.prod.yml). Fails
          # here, not at deploy time, if the build context or a COPY source
          # (e.g. openapi/openapi.json, frontend/nginx.conf) is missing.
          docker compose -f deploy/docker-compose.prod.yml build backend frontend
