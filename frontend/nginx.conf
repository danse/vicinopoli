server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The HTML entry is revalidated on every load so a refresh always picks
    # up the content-hashed asset references of the latest build, instead of
    # keeping stale assets from the previous deployment.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # Content-hashed build output never changes for a given filename, so it can
    # be cached forever without revalidation.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and its registration helper must never be cache-pinned,
    # otherwise a deployed update may never activate for existing users.
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # The manifest is short-lived: it is cheap to refetch and its icon entries
    # may change between releases.
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # The admin tool is internal-only; never serve its entry on the public host.
    location = /admin.html {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}