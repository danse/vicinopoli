server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Only the admin entry and its hashed assets may be served by this
    # internal nginx. The public index.html must never be reachable here.
    location = /admin.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API traffic is proxied to the backend; the admin app talks to the same
    # FastAPI service, authenticated with X-Admin-Token.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        return 302 $scheme://$http_host/admin.html;
    }

    location / {
        return 404;
    }
}