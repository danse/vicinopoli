name: vicinopoli

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: vicinopoli
      POSTGRES_PASSWORD: vicinopoli
      POSTGRES_DB: vicinopoli
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vicinopoli -d vicinopoli"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001" # MinIO console (dev only)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://vicinopoli:vicinopoli@db:5432/vicinopoli
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: media
      # Dev/tests use the deterministic static geocoder by default. For manual
      # testing against a live provider, run with GEOCODER_MODE=photon (public
      # photon.komoot.io) or GEOCODER_MODE=nominatim.
      # Production always sets GEOCODER_MODE=photon.
      GEOCODER_MODE: ${GEOCODER_MODE:-static}
      NOMINATIM_BASE_URL: https://nominatim.openstreetmap.org
      PHOTON_BASE_URL: ${PHOTON_BASE_URL:-https://photon.komoot.io}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Shared token for the internal admin firehose (dev default; the e2e spec
      # uses the same value).
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - ./backups:/backups
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_COMMIT_HASH: ${VITE_COMMIT_HASH:-dev}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-info@vicinopoli.it}
        VITE_PUBLIC_BASE_URL: ${VITE_PUBLIC_BASE_URL:-http://localhost:8080}
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Internal admin firehose, bound to localhost only. Reuses the frontend build
  # image but serves the admin entry through its own nginx config.
  admin:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_COMMIT_HASH: ${VITE_COMMIT_HASH:-dev}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-info@vicinopoli.it}
        VITE_PUBLIC_BASE_URL: ${VITE_PUBLIC_BASE_URL:-http://localhost:8080}
    volumes:
      - ./frontend/admin-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    ports:
      - "127.0.0.1:8081:80"
      - "[::1]:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    image: caddy:2
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/Caddyfile.snippets:/etc/caddy/Caddyfile.snippets:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:
