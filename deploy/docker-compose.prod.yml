# vicinopoli — standalone production stack (Hetzner VPS).
#
# Self-contained (does NOT overlay docker-compose.yml) to avoid docker compose
# port-merge footguns. Deploy with:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
#
# Secrets come from a host .env (see deploy/.env.prod.example). Caddy owns
# :80/:443 and provisions Let's Encrypt TLS via the $DOMAIN env var.

name: vicinopoli-prod

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    expose:
      - "9000"

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: media
      MEDIA_PUBLIC_BASE_URL: https://${DOMAIN}/media
      GEOCODER_MODE: ${GEOCODER_MODE:-photon}
      NOMINATIM_BASE_URL: https://nominatim.openstreetmap.org
      PHOTON_BASE_URL: ${PHOTON_BASE_URL:-https://photon.komoot.io}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_SENTRY_DSN: ${SENTRY_DSN:-}
        VITE_COMMIT_HASH: ${VITE_COMMIT_HASH:-dev}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-info@vicinopoli.it}
        VITE_PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
    restart: unless-stopped
    expose:
      - "80"

  # Internal admin firehose: bound to localhost only, never exposed publicly.
  admin:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_SENTRY_DSN: ${SENTRY_DSN:-}
        VITE_COMMIT_HASH: ${VITE_COMMIT_HASH:-dev}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-info@vicinopoli.it}
        VITE_PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
    restart: unless-stopped
    volumes:
      - ../frontend/admin-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.snippets:/etc/caddy/Caddyfile.snippets:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:
